<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOLD AFTER DARK | LOGIN
</title>


<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">


</head>


<body>


<div class="background"></div>



<main class="container">



<section class="logo-area">


<div class="brand-tag">

BOLD RIDERS

</div>



<h1>

BOLD

<span>
AFTER DARK
</span>

</h1>



<p>
ACCESS YOUR NIGHT EXPERIENCE
</p>


</section>






<section class="register-card">


<div class="card-header">


<h2>

WELCOME BACK

</h2>


<p>

Login to access your ticket

</p>


</div>





<form id="loginForm">



<div class="input-box">


<label>

WHATSAPP

</label>


<input

id="loginWhatsapp"

type="tel"

placeholder="08xxxxxxxxxx"

required>


</div>





<div class="input-box">


<label>

PIN

</label>


<input

id="loginPin"

type="password"

maxlength="6"

placeholder="6 digit PIN"

required>


</div>





<button type="submit">

LOGIN

</button>



</form>






<div class="login-link">


Don't have access?


<a href="index.html">

Register

</a>


</div>




</section>



</main>




<script src="js/login.js"></script>


</body>


</html>
