<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOLD AFTER DARK LOGIN
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>



<main class="container">


<section class="register-card">



<div class="brand-tag">

BOLD RIDERS

</div>



<div class="card-header">


<h2>
WELCOME BACK
</h2>


<p>
Access your ticket
</p>


</div>





<form id="loginForm">



<div class="input-box">

<label>
WHATSAPP
</label>


<input

id="whatsapp"

type="tel"

placeholder="08xxxxxxxxxx"

required>


</div>





<div class="input-box">

<label>
PIN
</label>


<input

id="pin"

type="password"

maxlength="6"

placeholder="6 digit PIN"

required>


</div>




<button type="submit">

LOGIN

</button>



</form>



</section>



</main>



<script src="js/login.js"></script>


</body>

</html>
