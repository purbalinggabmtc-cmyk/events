<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bold After Dark</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
BOLD AFTER DARK
</h1>


<form id="registerForm">


<div class="form-group">

<label>
Nama
</label>

<input
type="text"
id="nama"
placeholder="Masukkan nama"
required>

</div>



<div class="form-group">

<label>
Nomor WhatsApp
</label>

<input
type="tel"
id="wa"
placeholder="08xxxxxxxxxx"
required>

</div>



<div class="form-group">

<label>
PIN (6 angka)
</label>

<input
type="password"
id="pin"
maxlength="6"
inputmode="numeric"
placeholder="Buat PIN"
required>

</div>



<div class="checkbox">


<input
type="checkbox"
id="buyCheck">


<label>

Saya ingin membeli merch

</label>


</div>




<div 
class="purchase"
id="purchaseBox">


<h3>
Pilihan Produk
</h3>



<div class="product-row">


<div>

Prost Beer

</div>


<input
type="number"
id="prostQty"
min="0"
value="0">


<div
id="prostSubtotal">

Rp0

</div>


</div>





<div class="product-row">


<div>

LA Bold 16

</div>


<input
type="number"
id="laBoldQty"
min="0"
value="0">


<div
id="laBoldSubtotal">

Rp0

</div>


</div>





<h3>
Kaos Event
</h3>


<div id="kaosContainer">


<div class="kaos-row">


<select class="sleeve">

<option value="">
Lengan
</option>

<option value="pendek">
Pendek
</option>

<option value="panjang">
Panjang
</option>


</select>




<select class="ukuran">


<option value="">
Ukuran
</option>

<option>M</option>

<option>L</option>

<option>XL</option>

<option>2XL</option>

<option>3XL</option>

<option>4XL</option>


</select>




<input
type="number"
class="kaosQty"
value="1"
min="1">



<div class="subtotal">

Rp0

</div>


</div>


</div>


</div>





<div class="total-box">

Total:

<span id="total">
Rp0
</span>


<br>


Kupon:

<span id="jumlahKupon">
0
</span>


</div>



<button type="submit">

REGISTER

</button>



</form>



<hr>


<p>
Sudah terdaftar?
</p>


<button type="button">

Masuk

</button>



</div>




<script src="harga.js"></script>

<script src="app.js"></script>


</body>

</html>
