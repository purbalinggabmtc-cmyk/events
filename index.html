<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOLD AFTER DARK | BOLD RIDERS
</title>


<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">


</head>


<body>


<div class="background"></div>



<main class="container">


    <!-- BRAND -->

    <section class="logo-area">


        <div class="brand-tag">

            BOLD RIDERS

        </div>



        <h1>

            BOLD

            <span>
                AFTER DARK
            </span>

        </h1>



        <p>
            ENTER THE NIGHT EXPERIENCE
        </p>


    </section>





    <!-- REGISTER CARD -->


    <section class="register-card">


        <div class="card-header">


            <h2>
                GET YOUR ACCESS
            </h2>


            <p>
                Register and become part of the night
            </p>


        </div>





        <form id="registerForm">



            <div class="input-box">


                <label>
                    FULL NAME
                </label>



                <input

                id="nama"

                type="text"

                placeholder="Enter your name"

                required>


            </div>





            <div class="input-box">


                <label>
                    WHATSAPP
                </label>



                <input

                id="whatsapp"

                type="tel"

                inputmode="numeric"

                pattern="[0-9]*"

                maxlength="15"

                placeholder="08xxxxxxxxxx"

                oninput="this.value=this.value.replace(/[^0-9]/g,'')"

                required>

            </div>





            <div class="input-box">


                <label>
                    CREATE PIN
                </label>


                <input

                id="pin"

                type="password"

                inputmode="numeric"

                pattern="[0-9]*"

                maxlength="6"

                placeholder="6 digit PIN"

                oninput="this.value=this.value.replace(/[^0-9]/g,'')"

                required>
            </div>





            <button type="submit">

                REGISTER

            </button>



        </form>





        <!-- LOGIN ACCESS -->


        <div class="login-link">


            Already registered?


            <a href="login.html">

                Login here

            </a>



        </div>




    </section>




</main>





<script src="js/register.js"></script>


</body>


</html>
