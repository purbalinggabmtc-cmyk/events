<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOLD AFTER DARK | OFFICIAL MERCH
</title>


<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">


</head>



<body>


<div class="background"></div>



<main class="container">



<section class="register-card merch-page">



<div class="brand-tag">

BOLD RIDERS

</div>



<h2>

OFFICIAL MERCHANDISE

</h2>



<p>

LIMITED NIGHT COLLECTION

</p>





<div class="product-grid">





<!-- =====================
 PROST BEER
===================== -->


<div class="product-card">


<h3>
PROST BEER
</h3>



<div class="price">

Rp55.000

</div>



<span>
+1 Lucky Draw
</span>




<div class="qty-box">


<label>
QUANTITY
</label>



<input

type="number"

id="qtyProst"

value="1"

min="1">


</div>





<button onclick="addProduct('prostBeer')">

ADD TO CART

</button>



</div>







<!-- =====================
 LA BOLD
===================== -->


<div class="product-card">


<h3>
LA BOLD 16
</h3>



<div class="price">

Rp50.000

</div>



<span>
+1 Lucky Draw
</span>





<div class="qty-box">


<label>
QUANTITY
</label>



<input

type="number"

id="qtyLaBold"

value="1"

min="1">


</div>





<button onclick="addProduct('laBold16')">

ADD TO CART

</button>



</div>







<!-- =====================
 KAOS
===================== -->


<div class="product-card kaos-card">


<h3>
BOLD RIDERS T-SHIRT
</h3>



<p>
Premium Event Shirt
</p>





<label>
TYPE LENGAN
</label>



<select id="lengan">


<option value="pendek">

Lengan Pendek

</option>


<option value="panjang">

Lengan Panjang (+10.000)

</option>


</select>







<label>
SIZE
</label>



<select id="ukuran">


<option value="M">

M - Rp100.000

</option>


<option value="L">

L - Rp100.000

</option>


<option value="XL">

XL - Rp100.000

</option>


<option value="2XL">

2XL - Rp105.000

</option>


<option value="3XL">

3XL - Rp110.000

</option>


<option value="4XL">

4XL - Rp115.000

</option>


</select>








<div class="qty-box">


<label>
QUANTITY

(MAX 3 PCS)

</label>



<input

type="number"

id="qtyKaos"

value="1"

min="1"

max="3">


</div>






<button onclick="addKaos()">

ADD KAOS

</button>



</div>





</div>








<!-- =====================
 CART
===================== -->


<div class="cart-box">



<h3>
YOUR ORDER
</h3>



<div id="cart">

Belum ada pesanan

</div>





<hr>





<p>
TOTAL
</p>



<h2 id="total">

Rp0

</h2>





<p>
LUCKY DRAW
</p>



<h2 id="kupon">

0 Nomor

</h2>





<button onclick="checkout()">

CHECKOUT

</button>




</div>







<button onclick="location.href='dashboard.html'">

BACK TO DASHBOARD

</button>





</section>



</main>







<script src="js/harga.js"></script>

<script src="js/merchandise.js"></script>



</body>

</html>
