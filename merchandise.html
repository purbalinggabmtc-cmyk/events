<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
BOLD AFTER DARK | MERCH
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="background"></div>



<main class="container">



<section class="register-card merch-page">



<div class="brand-tag">

BOLD RIDERS

</div>



<h2>
OFFICIAL MERCHANDISE
</h2>


<p>
Limited event collection
</p>




<!-- PRODUCT -->


<div class="product-grid">



<div class="product-card">


<h3>
PROST BEER
</h3>


<div class="price">

Rp55.000

</div>


<span>
+1 Lucky Draw

</span>



<button onclick="addProduct('prostBeer')">

ADD

</button>


</div>





<div class="product-card">


<h3>
LA BOLD 16
</h3>


<div class="price">

Rp50.000

</div>


<span>
+1 Lucky Draw

</span>



<button onclick="addProduct('laBold16')">

ADD

</button>


</div>





<div class="product-card kaos-card">


<h3>
BOLD RIDERS T-SHIRT
</h3>



<label>
Jenis Lengan
</label>


<select id="lengan">


<option value="pendek">

Lengan Pendek

</option>


<option value="panjang">

Lengan Panjang

</option>


</select>





<label>
Ukuran
</label>


<select id="ukuran">


<option>M</option>

<option>L</option>

<option>XL</option>

<option>2XL</option>

<option>3XL</option>

<option>4XL</option>


</select>




<button onclick="addKaos()">

ADD KAOS

</button>


</div>



</div>





<!-- CART -->


<div class="cart-box">


<h3>
YOUR ORDER
</h3>


<div id="cart">

Belum ada pesanan

</div>



<hr>


<p>
TOTAL
</p>


<h2 id="total">

Rp0

</h2>



<p>
LUCKY DRAW
</p>


<h2 id="kupon">

0

</h2>



<button>

CHECKOUT

</button>



</div>





<button onclick="location.href='dashboard.html'">

BACK

</button>



</section>



</main>




<script src="js/harga.js"></script>

<script src="js/merchandise.js"></script>



</body>

</html>
